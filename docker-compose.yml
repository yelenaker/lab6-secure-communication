services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Client is interactive; run manually with:
  # docker compose run --rm client
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      - SERVER_URL=http://server:8000
    depends_on:
      server:
        condition: service_healthy
    stdin_open: true
    tty: true
    profiles:
      - client
